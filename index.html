    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vite-ui-theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Abdihakim Hassan Mohamud (Eng Abdihakim Hassan) | Software Engineering Student @ JUST</title>
    <meta
      name="description"
      content="Portfolio of Abdihakim Hassan Mohamud (Eng Abdihakim Hassan), Aspiring Software Engineering Student at Jamhuriya University (JUST) in Mogadishu, Somalia."
    />

    <meta
      property="og:description"
      content="Aspiring Software Engineering Student at Jamhuriya University in Mogadishu, Somalia. Building modern web applications with HTML, CSS, JavaScript, React, and Node.js."
